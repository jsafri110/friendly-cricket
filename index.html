<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Friendly Cricket Series</title>
<meta name="description" content="Live scores, fixtures, points table and player stats for the Friendly Cricket Series.">
<meta name="theme-color" content="#0F3B2C">
<meta property="og:title" content="Friendly Cricket Series">
<meta property="og:description" content="Live scores, fixtures, points table and player stats.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F3B2C'/%3E%3Ccircle cx='32' cy='32' r='17' fill='%23F2B705'/%3E%3Cpath d='M20 24c8 5 16 5 24 0M20 40c8-5 16-5 24 0' stroke='%23231A00' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Teko:wght@500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one mobile-first column; turf header band with a tape-ball stripe, scorebook cards below, a thumb-sized scoring pad. */
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --sunk:#E3E9E3; --ink:#14211B; --muted:#5A6A61; --line:#D3DCD5;
  --turf:#0F3B2C; --turf-2:#14513C; --turf-ink:#F1F6F0; --turf-muted:#A9C2B5;
  --tape:#F2B705; --tape-ink:#231A00; --red:#C7372C; --red-ink:#FFFFFF; --good:#1E7A4C; --four:#1D6FA5;
  --display:'Teko', 'Arial Narrow', Impact, sans-serif;
  --body:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1310; --surface:#121D18; --sunk:#0E1814; --ink:#E4ECE6; --muted:#90A298; --line:#22332B;
  --turf:#0A2A1F; --turf-2:#103A2C; --turf-ink:#E8F0EA; --turf-muted:#8FAA9C;
  --tape:#F5C53A; --tape-ink:#1E1600; --red:#E0564A; --red-ink:#FFFFFF; --good:#41B07A; --four:#5AA9DE; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1310; --surface:#121D18; --sunk:#0E1814; --ink:#E4ECE6; --muted:#90A298; --line:#22332B;
  --turf:#0A2A1F; --turf-2:#103A2C; --turf-ink:#E8F0EA; --turf-muted:#8FAA9C;
  --tape:#F5C53A; --tape-ink:#1E1600; --red:#E0564A; --red-ink:#FFFFFF; --good:#41B07A; --four:#5AA9DE; color-scheme:dark }

*{box-sizing:border-box}
html,body{overscroll-behavior:none}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.45}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--turf)}
.wrap{max-width:760px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tape); outline-offset:2px}
h1,h2,h3{font-family:var(--display); font-weight:600; letter-spacing:.01em; line-height:1; margin:0; text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Header */
.top{background:var(--turf); color:var(--turf-ink)}
.top-in{display:flex; gap:12px; align-items:flex-end; justify-content:space-between; padding-block:18px 14px; flex-wrap:wrap}
.brand{min-width:0}
.eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--turf-muted); font-weight:600}
.top h1{font-size:40px; text-transform:uppercase; margin-top:4px}
.top-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.tapestripe{height:10px; background:repeating-linear-gradient(-45deg, var(--tape) 0 14px, color-mix(in srgb, var(--tape) 78%, #000) 14px 18px)}
.chip{display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 11px; font-size:12px; font-weight:600; border:1px solid transparent; background:var(--turf-2); color:var(--turf-ink)}
.chip.on{background:var(--tape); color:var(--tape-ink)}
.chip .led{width:7px; height:7px; border-radius:50%; background:var(--turf-muted)}
.chip.live .led{background:#4BD18B} .chip.warn .led{background:var(--tape)} .chip.err .led{background:var(--red)}
.chip.btn{border:1px solid color-mix(in srgb, var(--turf-ink) 25%, transparent); background:transparent}

/* Tabs */
.tabs{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); border-bottom:1px solid var(--line)}
.tabs-in{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{border:0; background:none; padding:12px 10px 10px; font-weight:600; font-size:14px; color:var(--muted); border-bottom:3px solid transparent; white-space:nowrap}
.tab.on{color:var(--ink); border-bottom-color:var(--tape)}

main.wrap{padding-block:18px 60px; display:flex; flex-direction:column; gap:22px}
.sec{display:flex; flex-direction:column; gap:10px}
.sec-h{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.sec-h h2{font-size:26px; text-transform:uppercase}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px}
.empty{border:1px dashed var(--line); border-radius:var(--r); padding:18px; color:var(--muted); background:var(--surface)}
.note{background:color-mix(in srgb, var(--tape) 16%, var(--surface)); border:1px solid color-mix(in srgb, var(--tape) 45%, var(--line)); border-radius:var(--r); padding:12px 14px; font-size:14px}

/* Match cards */
.mlist{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:10px}
.mcard{display:flex; flex-direction:column; gap:7px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; width:100%}
.mcard:hover{border-color:color-mix(in srgb, var(--ink) 30%, var(--line))}
.mcard.live{border-color:var(--good); box-shadow:inset 3px 0 0 var(--good)}
.mmeta{display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); flex-wrap:wrap}
.mrow{display:flex; justify-content:space-between; align-items:center; gap:10px}
.tname{display:flex; align-items:center; gap:8px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tname.lose{color:var(--muted); font-weight:500}
.dot{width:10px; height:10px; border-radius:3px; background:var(--c); flex:none}
.msc{font-family:var(--display); font-size:24px; line-height:1; white-space:nowrap; font-variant-numeric:tabular-nums}
.msc small{font-family:var(--body); font-size:12px; color:var(--muted)}
.mres{font-size:13px; font-weight:600; color:var(--good)}
.pill{font-size:10px; text-transform:uppercase; letter-spacing:.12em; font-weight:700; padding:2px 7px; border-radius:4px; background:var(--sunk); color:var(--muted)}
.pill.live{background:var(--good); color:#fff}

/* Tables */
.tbl-wrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{padding:9px 10px; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums}
th{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; border-bottom:1px solid var(--line)}
td{border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent)}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child,.tl{text-align:left}
td.name{white-space:normal; min-width:130px}
td.name .how{display:block; font-size:12px; color:var(--muted)}
tr.top1 td{background:color-mix(in srgb, var(--tape) 14%, transparent)}
.form{display:inline-flex; gap:3px}
.form i{font-style:normal; width:18px; height:18px; border-radius:4px; display:inline-grid; place-items:center; font-size:10px; font-weight:700; background:var(--sunk); color:var(--muted)}
.form i.W{background:var(--good); color:#fff} .form i.L{background:var(--red); color:#fff}

/* Ball chips */
.balls{display:flex; flex-wrap:wrap; gap:5px}
.b{min-width:30px; height:30px; padding:0 6px; border-radius:15px; display:inline-grid; place-items:center; font-size:12px; font-weight:700; background:var(--sunk); color:var(--ink); border:1px solid var(--line); font-variant-numeric:tabular-nums}
.b.w{background:var(--red); color:var(--red-ink); border-color:var(--red)}
.b.f{background:var(--four); color:#fff; border-color:var(--four)}
.b.s{background:var(--tape); color:var(--tape-ink); border-color:var(--tape)}
.b.x{background:transparent; border-style:dashed}
.over-row{display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--line)}
.over-row:first-child{border-top:0}
.over-lbl{width:92px; flex:none; font-size:12px; color:var(--muted)}
.over-lbl b{display:block; color:var(--ink); font-size:13px}

/* Buttons */
.btn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:10px 14px; font-weight:600}
.btn.primary{background:var(--turf); color:var(--turf-ink); border-color:var(--turf)}
.btn.tape{background:var(--tape); color:var(--tape-ink); border-color:var(--tape)}
.btn.danger{color:var(--red); border-color:color-mix(in srgb, var(--red) 40%, var(--line))}
.btn:disabled{opacity:.45; cursor:not-allowed}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.back{border:0; background:none; padding:0; color:var(--muted); font-weight:600; display:inline-flex; gap:6px; align-items:center}

/* Selectable chips */
.opts{display:flex; flex-wrap:wrap; gap:6px}
.opt{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 13px; font-weight:600; font-size:14px}
.opt.on{background:var(--turf); color:var(--turf-ink); border-color:var(--turf)}
.opt:disabled{opacity:.4}
.opt small{font-weight:500; opacity:.7}
.opt.runner{border:2px dashed var(--tape); background:color-mix(in srgb, var(--tape) 14%, var(--surface))}
.opt.runner small{opacity:1; font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-size:11px}

/* Forms */
.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.field label,.lbl{font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:9px 11px; width:100%}
.field textarea{min-height:110px; resize:vertical; line-height:1.5}
.grid2{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:12px}
.check{display:flex; gap:10px; align-items:flex-start; font-size:14px}
.check input{width:18px; height:18px; margin-top:2px}

/* Leaderboards */
.lb{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:10px}
.lb .card h3{font-size:22px; text-transform:uppercase; margin-bottom:8px}
.lb ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.lb li{display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-top:1px solid var(--line); align-items:baseline}
.lb li:first-child{border-top:0}
.lb li .who{min-width:0}
.lb li .who b{display:block; font-weight:600}
.lb li .who span{font-size:12px; color:var(--muted)}
.lb li .v{font-family:var(--display); font-size:26px; line-height:1}
.lb li:first-child .v{color:var(--good)}

/* Scoring */
.score-bar{display:flex; justify-content:space-between; align-items:center; gap:10px; padding-block:12px}
.board{background:var(--turf); color:var(--turf-ink); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:6px}
.board .who{font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--turf-muted); font-weight:600}
.board .big{font-family:var(--display); font-size:64px; line-height:.85; font-variant-numeric:tabular-nums}
.board .big small{font-size:28px; color:var(--turf-muted)}
.board .eq{font-size:14px; font-weight:600; color:var(--tape)}
.crease{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.bat{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-width:0}
.bat.on{border-color:var(--tape); box-shadow:inset 0 0 0 1px var(--tape)}
.bat .n{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bat .s{font-family:var(--display); font-size:28px; line-height:1}
.bat .s small{font-family:var(--body); font-size:12px; color:var(--muted)}
.bowlline{display:flex; justify-content:space-between; gap:10px; align-items:center; font-size:14px}
.pad{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.k{height:62px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-family:var(--display); font-size:34px; line-height:1; touch-action:manipulation}
.k:active{transform:translateY(1px)}
.k.sm{font-family:var(--body); font-size:15px; font-weight:700}
.k.four{background:var(--four); color:#fff; border-color:var(--four)}
.k.six{background:var(--tape); color:var(--tape-ink); border-color:var(--tape)}
.k.wk{background:var(--red); color:var(--red-ink); border-color:var(--red); grid-column:span 2; font-size:30px}
.k.util{background:var(--sunk)}
.pad-wrap{position:relative}
.saving{position:absolute; inset:-4px; background:color-mix(in srgb, var(--bg) 80%, transparent); display:grid; place-items:center; border-radius:12px; font-weight:700; z-index:2}

/* Sheet */
.scrim{position:fixed; inset:0; background:rgba(5,15,10,.55); z-index:40; display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--bg); width:100%; max-width:560px; max-height:88vh; overflow:auto; border-radius:16px 16px 0 0; padding:18px max(16px, env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px)); display:flex; flex-direction:column; gap:14px}
.sheet h3{font-size:30px; text-transform:uppercase}
@media (min-width:700px){ .scrim{align-items:center} .sheet{border-radius:16px} }

/* Performances */
.perf{display:flex; justify-content:space-between; gap:10px; align-items:center}
.perf .pts{font-family:var(--display); font-size:30px; line-height:1}
.posts{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px}
.post{display:flex; flex-direction:column; gap:8px}
.post img{border-radius:10px; border:1px solid var(--line); width:100%; aspect-ratio:4/5; object-fit:cover; background:var(--turf)}
.ms{display:flex; gap:12px; align-items:center; padding:9px 0; border-top:1px solid var(--line)}
.ms:first-child{border-top:0}
.badge{font-family:var(--display); font-size:18px; line-height:1; padding:5px 8px 3px; border-radius:5px; background:var(--tape); color:var(--tape-ink); min-width:76px; text-align:center}
.badge.lo{background:var(--sunk); color:var(--ink)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-weight:600; z-index:60; font-size:14px}

/* Coin toss */
.coin-stage{display:flex; gap:18px; align-items:center; flex-wrap:wrap}
.coin{width:96px; height:96px; border-radius:50%; flex:none; display:grid; place-items:center; font-family:var(--display); font-size:56px; color:var(--tape-ink);
  background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--tape) 55%, #fff), var(--tape) 55%, color-mix(in srgb, var(--tape) 70%, #000)); box-shadow:inset 0 0 0 5px color-mix(in srgb, var(--tape) 70%, #000)}
.coin.spin{animation:coinflip 1.4s cubic-bezier(.25,.6,.3,1) both}
@keyframes coinflip{0%{transform:translateY(0) rotateX(0)} 45%{transform:translateY(-70px) rotateX(1080deg)} 100%{transform:translateY(0) rotateX(1800deg)}}

button.bat{font:inherit; color:inherit; text-align:left; cursor:pointer; width:100%; touch-action:manipulation}
button.bat:disabled{cursor:default; opacity:1}
button.bat:not(:disabled):active{transform:translateY(1px)}
.swap-hint{font-size:11px; font-weight:600; color:var(--muted); margin-top:2px}
.k.swapk{background:color-mix(in srgb, var(--tape) 22%, var(--surface)); border-color:color-mix(in srgb, var(--tape) 60%, var(--line))}
@media (max-width:420px){ .top h1{font-size:34px} .board .big{font-size:56px} .k{height:58px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== Cricket engine (pure functions) =====
const KIND_LABEL = {bowled:'Bowled', caught:'Caught', lbw:'LBW', stumped:'Stumped', hitwicket:'Hit wicket', outofbox:'Out of box', runout:'Run out'};
const FIELD_KEY = {caught:'ct', runout:'ro', stumped:'st'};
const DEFAULT_SERIES = {name:'Friendly Cricket Series', overs:6, bpo:6, wideRuns:1, nbRuns:1, ptsWin:2, ptsTie:1, perTeam:4,
  grounds:['Ground 5','Ground 6'], maxOversTop:2, maxOversOther:1, boxToBowler:true, xiSize:7, date:'', start:'01:00', slotMins:30};

function creditsBowler(k, S){ if(k==='runout') return false; if(k==='outofbox') return S.boxToBowler!==false; return true; }
function isLegal(b){ return b.x!=='wd' && b.x!=='nb'; }
function ballTotal(b, S){
  if(b.x==='wd') return S.wideRuns + (b.e||0);
  if(b.x==='nb') return S.nbRuns + (b.r||0);
  return (b.r||0) + (b.e||0);
}
function ballConceded(b, S){ return (b.x==='b' || b.x==='lb') ? 0 : ballTotal(b, S); }
function ranRuns(b){ return (b.x==='wd' || b.x==='b' || b.x==='lb') ? (b.e||0) : (b.r||0); }
function xiLen(m, team){ return ((m.xi && m.xi[team]) || []).length; }
function oversStr(balls, S){ const o=Math.floor(balls/S.bpo), r=balls%S.bpo; return r ? o+'.'+r : String(o); }

function innStats(inn, S){
  const bat={}, bowl={}, field={}, order=[], bowlOrder=[], fow=[], overs=[];
  let runs=0, w=0, legal=0; const ext={wd:0, nb:0, b:0, lb:0};
  const addBat = id => { if(id && !bat[id]){ bat[id]={r:0,b:0,f4:0,f6:0,out:null}; order.push(id); } };
  (inn.openers||[]).forEach(addBat);
  for(const b of inn.balls){
    addBat(b.st); addBat(b.ns);
    const ov = Math.floor(legal / S.bpo);
    if(!bowl[b.bw]){ bowl[b.bw]={balls:0,runs:0,w:0,md:0,dots:0,wd:0,nb:0,ov:{}}; bowlOrder.push(b.bw); }
    const bw = bowl[b.bw]; bw.ov[ov]=1;
    const t = ballTotal(b, S), c = ballConceded(b, S);
    runs += t; bw.runs += c;
    if(b.x==='wd'){ ext.wd += t; bw.wd++; }
    else if(b.x==='nb'){ ext.nb += S.nbRuns; bw.nb++; }
    else if(b.x==='b') ext.b += b.e||0;
    else if(b.x==='lb') ext.lb += b.e||0;
    if(b.x!=='wd' && bat[b.st]){
      const s = bat[b.st]; s.b++;
      if(b.x!=='b' && b.x!=='lb'){ s.r += b.r||0; if(b.r===4) s.f4++; if(b.r===6) s.f6++; }
    }
    if(!overs[ov]) overs[ov] = {bw:b.bw, runs:0, total:0, legal:0, balls:[]};
    const O = overs[ov]; O.runs += c; O.total += t; O.balls.push(b);
    if(isLegal(b)){ legal++; bw.balls++; O.legal++; if(c===0) bw.dots++; }
    if(b.w){
      w++;
      const o = bat[b.w.p]; if(o) o.out = {k:b.w.k, f:b.w.f, bw:b.bw};
      if(creditsBowler(b.w.k, S)) bw.w++;
      const fk = FIELD_KEY[b.w.k];
      if(fk && b.w.f){ const f = field[b.w.f] = field[b.w.f] || {ct:0, ro:0, st:0}; f[fk]++; }
      fow.push({w, runs, p:b.w.p, legal});
    }
  }
  overs.forEach(o => { if(o && o.legal===S.bpo && o.runs===0 && bowl[o.bw]) bowl[o.bw].md++; });
  for(const id in bowl) bowl[id].overs = Object.keys(bowl[id].ov).length;
  return {runs, w, legal, ext, bat, bowl, field, order, bowlOrder, fow, overs};
}

function target(m, S){ return m.innings[0] ? innStats(m.innings[0], S).runs + 1 : null; }

function inningsOver(m, i, S){
  const inn = m.innings[i], s = innStats(inn, S);
  if(s.legal >= S.overs*S.bpo) return true;
  if(s.w >= xiLen(m, inn.bat)) return true;
  if(i===1 && s.runs >= target(m, S)) return true;
  return false;
}

// What the scorer must do next
function scoringNeed(m, S){
  if(!m.innings || !m.innings.length) return 'toss';
  const i = m.innings.length-1, inn = m.innings[i];
  if(inn.done) return i===0 ? 'break' : 'result';
  if(!inn.started) return 'openers';
  const s = innStats(inn, S), xl = xiLen(m, inn.bat);
  if(!inn.cur.st) return 'batter';
  if(s.w < xl-1 && !inn.cur.ns) return 'batter';
  if(!inn.cur.bw) return 'bowler';
  return 'ball';
}

function applyBall(m, ball, S){
  const i = m.innings.length-1, inn = m.innings[i], cur = inn.cur;
  ball.st = cur.st; ball.ns = cur.ns; ball.bw = cur.bw; ball.pc = {st:cur.st, ns:cur.ns, bw:cur.bw};
  inn.balls.push(ball);
  let st = cur.st, ns = cur.ns;
  if(ranRuns(ball) % 2 === 1){ [st, ns] = [ns, st]; }
  if(ball.w){ if(ball.w.p===st) st=null; else if(ball.w.p===ns) ns=null; }
  const s = innStats(inn, S), xl = xiLen(m, inn.bat);
  const overEnd = isLegal(ball) && s.legal % S.bpo === 0;
  if(overEnd){ [st, ns] = [ns, st]; }
  if(s.w >= xl-1){ const last = st || ns; st = last || null; ns = null; } // last man bats alone
  inn.cur = {st, ns, bw: overEnd ? null : cur.bw};
  if(inningsOver(m, i, S)) inn.done = true;
}

function undoBall(m){
  if(!m.innings || !m.innings.length) return false;
  let inn = m.innings[m.innings.length-1];
  if(!inn.balls.length){
    if(inn.started){ inn.started=false; inn.cur={st:null, ns:null, bw:null}; return true; }
    if(m.innings.length>1){ m.innings.pop(); return true; }
    m.innings = []; m.status = 'upcoming'; if(m.toss) delete m.toss.d; return true;
  }
  const b = inn.balls.pop(); inn.cur = b.pc; inn.done = false;
  m.status = 'live'; delete m.mom; delete m.soWinner;
  return true;
}

function bowlerOptions(m, S){
  const inn = m.innings[m.innings.length-1], s = innStats(inn, S);
  const curOver = Math.floor(s.legal / S.bpo);
  const prev = s.overs[curOver-1], last = prev ? prev.bw : null;
  const cnt = {}; for(const id in s.bowl) cnt[id] = s.bowl[id].overs;
  const topTaken = Object.values(cnt).some(c => c > S.maxOversOther);
  return (m.xi[inn.bowl]||[]).map(id => {
    const c = cnt[id]||0; let ok = true, why = '';
    if(id===last){ ok=false; why='Bowled the last over'; }
    else if(c >= S.maxOversTop){ ok=false; why=`Bowled ${c} overs`; }
    else if(c >= S.maxOversOther && topTaken){ ok=false; why='Quota used'; }
    return {id, c, ok, why};
  });
}

function matchResult(m, S){
  if(m.nr) return {type:'nr', text:'No result'};
  if(!m.innings || m.innings.length<2 || !m.innings[1].done) return null;
  const a = innStats(m.innings[0], S), b = innStats(m.innings[1], S);
  const t1 = m.innings[0].bat, t2 = m.innings[1].bat;
  if(b.runs > a.runs){ const wl = xiLen(m, t2) - b.w; return {type:'win', winner:t2, loser:t1, margin:`${wl} wicket${wl===1?'':'s'}`}; }
  if(a.runs > b.runs){ const d = a.runs - b.runs; return {type:'win', winner:t1, loser:t2, margin:`${d} run${d===1?'':'s'}`}; }
  return {type:'tie', winner: m.soWinner || null, loser: m.soWinner ? (m.soWinner===t1?t2:t1) : null, margin:'super over'};
}

function pointsTable(st){
  const S = st.series, T = {};
  st.teams.forEach(t => T[t.id] = {id:t.id, p:0, w:0, l:0, t:0, nr:0, pts:0, rf:0, bf:0, ra:0, ba:0, form:[]});
  const done = st.matches.filter(m => m.status==='done' && !m.trial).sort((a,b)=>a.no-b.no);
  for(const m of done){
    const res = matchResult(m, S), A = T[m.home], B = T[m.away];
    if(!A || !B || !res) continue;
    A.p++; B.p++;
    if(res.type==='nr'){ A.nr++; B.nr++; A.pts+=S.ptsTie; B.pts+=S.ptsTie; A.form.push('N'); B.form.push('N'); continue; }
    if(res.winner){ const W=T[res.winner], Lo=T[res.loser]; W.w++; Lo.l++; W.pts+=S.ptsWin; W.form.push('W'); Lo.form.push('L'); }
    else { A.t++; B.t++; A.pts+=S.ptsTie; B.pts+=S.ptsTie; A.form.push('T'); B.form.push('T'); }
    for(const inn of m.innings){
      const s = innStats(inn, S), balls = s.w >= xiLen(m, inn.bat) ? S.overs*S.bpo : s.legal;
      T[inn.bat].rf += s.runs; T[inn.bat].bf += balls; T[inn.bowl].ra += s.runs; T[inn.bowl].ba += balls;
    }
  }
  const rows = Object.values(T);
  rows.forEach(r => { r.nrr = (r.bf ? r.rf/(r.bf/S.bpo) : 0) - (r.ba ? r.ra/(r.ba/S.bpo) : 0); });
  rows.sort((a,b) => b.pts-a.pts || b.nrr-a.nrr || b.w-a.w);
  return rows;
}

function perfPoints(p, S){
  let x = p.r;
  if(p.b >= 5) x += (p.r/p.b*100 - 120)/10;
  x += p.wk*20 + p.md*8;
  if(p.balls >= S.bpo) x += (10 - p.conc/(p.balls/S.bpo))*2;
  x += (p.ct + p.ro + p.stp)*8;
  return Math.round(x*10)/10;
}

function matchPerf(m, S){
  const P = {};
  const g = id => P[id] = P[id] || {id, team:null, r:0, b:0, f4:0, f6:0, out:false, batted:false, wk:0, balls:0, conc:0, md:0, ct:0, ro:0, stp:0};
  for(const inn of (m.innings||[])){
    const s = innStats(inn, S);
    s.order.forEach(id => { const p=g(id), x=s.bat[id]; p.team=inn.bat; p.r+=x.r; p.b+=x.b; p.f4+=x.f4; p.f6+=x.f6; if(x.b>0||x.out) p.batted=true; if(x.out) p.out=true; });
    s.bowlOrder.forEach(id => { const p=g(id), x=s.bowl[id]; p.team=inn.bowl; p.wk+=x.w; p.balls+=x.balls; p.conc+=x.runs; p.md+=x.md; });
    for(const id in s.field){ const p=g(id), f=s.field[id]; p.team=p.team||inn.bowl; p.ct+=f.ct; p.ro+=f.ro; p.stp+=f.st; }
  }
  Object.values(P).forEach(p => p.pts = perfPoints(p, S));
  return P;
}

function topPerformances(m, S, n=3){
  return Object.values(matchPerf(m, S)).sort((a,b)=>b.pts-a.pts).slice(0, n);
}

function seriesStats(st, onlyDone=true){
  const S = st.series, A = {};
  const g = id => A[id] = A[id] || {id, mat:0, inns:0, r:0, b:0, f4:0, f6:0, no:0, hs:0, hsNo:false, wk:0, balls:0, conc:0, md:0, ct:0, ro:0, stp:0, pts:0, mom:0, best:null};
  for(const m of st.matches){
    if(m.trial) continue;
    if(onlyDone ? m.status!=='done' : !(m.innings&&m.innings.length)) continue;
    if(m.nr && !(m.innings&&m.innings.length)) continue;
    const P = matchPerf(m, S);
    for(const id in P){
      const p = P[id], a = g(id); a.mat++; a.pts += p.pts;
      if(p.batted){ a.inns++; if(!p.out) a.no++; if(p.r > a.hs || (p.r===a.hs && !p.out)){ a.hs=p.r; a.hsNo=!p.out; } }
      a.r+=p.r; a.b+=p.b; a.f4+=p.f4; a.f6+=p.f6; a.wk+=p.wk; a.balls+=p.balls; a.conc+=p.conc; a.md+=p.md; a.ct+=p.ct; a.ro+=p.ro; a.stp+=p.stp;
      if(p.balls && (!a.best || p.wk>a.best.w || (p.wk===a.best.w && p.conc<a.best.r))) a.best = {w:p.wk, r:p.conc};
    }
    if(m.mom) g(m.mom).mom++;
  }
  Object.values(A).forEach(a => {
    a.sr = a.b ? a.r/a.b*100 : 0;
    a.econ = a.balls ? a.conc/(a.balls/S.bpo) : 0;
    a.avg = (a.inns - a.no) > 0 ? a.r/(a.inns - a.no) : null;
    a.pos = a.pts + a.mom*10;
  });
  return A;
}

function hatTricks(inn, S){
  const streak = {}, res = [];
  for(const b of inn.balls){
    const credited = !!(b.w && creditsBowler(b.w.k, S));
    if(!isLegal(b) && !credited) continue;
    streak[b.bw] = credited ? (streak[b.bw]||0)+1 : 0;
    if(streak[b.bw]===3) res.push(b.bw);
  }
  return res;
}

const MS_RANK = {hattrick:100, hundred:95, five:90, fifty:85, four:80, three:60, thirty:55, maiden:40};
const MS_BADGE = {hattrick:'HAT-TRICK', hundred:'100', five:'5 WKTS', fifty:'50', four:'4 WKTS', three:'3 WKTS', thirty:'30+', maiden:'MAIDEN'};

}

// ===== Fixture generator =====
function shuffle(a, rnd=Math.random){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function genSchedule(teamIds, k, nGrounds, rnd=Math.random){
  const n = teamIds.length;
  if(n < 2) return {error:'Add at least 2 teams first.'};
  if(k > n-1) return {error:`With ${n} teams, each team can play at most ${n-1} matches.`};
  if((n*k) % 2) return {error:`${n} teams × ${k} matches is an odd number, so it can't be split into pairs. Change matches per team.`};
  let pairs = null;
  for(let t=0; t<5000 && !pairs; t++){
    const all = []; for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) all.push([teamIds[i], teamIds[j]]);
    shuffle(all, rnd);
    const deg = {}; teamIds.forEach(id=>deg[id]=0); const pick = [];
    for(const [a,b] of all) if(deg[a]<k && deg[b]<k){ pick.push([a,b]); deg[a]++; deg[b]++; }
    if(pick.length === n*k/2) pairs = pick;
  }
  if(!pairs) return {error:'Could not build fixtures. Try again.'};
  const G = Math.max(1, nGrounds);
  let best = null, bestScore = Infinity;
  for(let t=0; t<1500; t++){
    const rem = shuffle(pairs.slice(), rnd), slots = [];
    while(rem.length){
      const slot = [], used = new Set();
      for(let i=0; i<rem.length && slot.length<G; i++){
        const [a,b] = rem[i]; if(used.has(a)||used.has(b)) continue;
        slot.push(rem[i]); used.add(a); used.add(b); rem.splice(i,1); i--;
      }
      slots.push(slot);
    }
    let score = slots.length*1000;
    for(let s=1; s<slots.length; s++){
      const prev = new Set(slots[s-1].flat());
      slots[s].flat().forEach(id => { if(prev.has(id)) score += 1; });
    }
    if(score < bestScore){ bestScore = score; best = slots; }
  }
  const out = []; let no = 1;
  best.forEach((slot, si) => slot.forEach((p, gi) => {
    const [h,a] = rnd()<0.5 ? p : [p[1],p[0]];
    out.push({no: no++, slot: si+1, ground: gi, home:h, away:a});
  }));
  return {fixtures: out};
}

// Resting teams umpire: in each slot every idle team takes one match, balanced across the series.
function assignUmpires(matches, teamIds, rnd=Math.random){
  const cnt = {}; teamIds.forEach(id => cnt[id] = 0);
  const slots = [...new Set(matches.map(m => m.slot))].sort((a,b)=>a-b);
  for(const s of slots){
    const ms = matches.filter(m => m.slot === s).sort((a,b)=>a.ground-b.ground);
    const busy = new Set(ms.flatMap(m => [m.home, m.away]));
    const idle = shuffle(teamIds.filter(id => !busy.has(id)), rnd).sort((a,b)=>cnt[a]-cnt[b]);
    const near = (m, u) => matches.some(x => x.ground === m.ground && Math.abs(x.slot - s) === 1 && (x.home === u || x.away === u)) ? 0 : 1;
    let best = null, bs = Infinity;
    const perm = (arr, k) => { if(k === arr.length){ const pick = ms.map((m,i)=>arr[i]); let sc = 0; ms.forEach((m,i)=>{ if(!pick[i]) return; sc += cnt[pick[i]]*10 + near(m, pick[i]); }); if(sc < bs){ bs = sc; best = pick.slice(); } return; } for(let i=k;i<arr.length;i++){ [arr[k],arr[i]]=[arr[i],arr[k]]; perm(arr,k+1); [arr[k],arr[i]]=[arr[i],arr[k]]; } };
    const pool = idle.slice(0, Math.max(ms.length, idle.length)); perm(pool, 0);
    ms.forEach((m,i) => { m.ump = (best && best[i]) || null; if(m.ump) cnt[m.ump]++; });
  }
  return matches;
}
function slotTime(S, slot){
  const [h, mi] = (S.start || '01:00').split(':').map(Number), t = (h*60 + (mi||0) + (slot-1)*(S.slotMins||30)) % 1440;
  return String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
}

    else if(data && (data.error === 'bad_pin' || data.error === 'locked')){ toast('Your scorer login is no longer valid. Log in again.'); logout(); }
    else if(data && data.error === 'taken'){ pendingDone(id, 1e9); if(data.data){ const i = state.matches.findIndex(x => x.id === id); if(i >= 0) state.matches[i] = data.data; } if(ui.score === id){ ui.score = null; ui.match = id; } toast(`This match is already being scored by ${scorerName(data.scorer)}.`); render(); }
    else if(data && data.error === 'not_allowed'){ pendingDone(id, 1e9); toast('This change needs the organiser login.'); }
  } catch(e){ saving.delete(id); sync = 'offline'; updateChip(); clearTimeout(retryTimer); retryTimer = setTimeout(flushAll, 5000); return; }
  saving.delete(id);
  const left = Object.keys(store.get(PKEY) || {});
  sync = left.length ? 'saving' : 'live'; updateChip();
  if(left.includes(id)) queueSave(matchById(id));
}
function flushAll(){ const p = store.get(PKEY) || {}; Object.keys(p).forEach(id => queueSave(matchById(id))); }
window.addEventListener('online', flushAll);
async function touchSetup(){
  if(!isAdmin()){ toast('Only the organiser can change the series setup.'); return; }
  state.setupRev++;
  sync = 'saving'; render();
  const cfg = {series: state.series, teams: state.teams, setupRev: state.setupRev};
  const ms = state.matches.filter(m => !m.trial);
  try {
    const {data, error} = await sb.rpc('fc_save_setup', {p_pin: auth.pin, p_config: cfg, p_matches: ms});
    if(error) throw error;
    if(!data || !data.ok){ toast('Setup not saved: organiser login rejected.'); logout(); return; }
    sync = 'live';
  } catch(e){ sync = 'offline'; toast('Setup not saved. Check your connection and try again.'); }
  updateChip();
}
async function deleteMatch(id){
  const i = state.matches.findIndex(m => m.id === id); if(i >= 0) state.matches.splice(i, 1);
  const p = store.get(PKEY) || {}; delete p[id]; store.set(PKEY, p);
  try { await sb.rpc('fc_delete_match', {p_team: auth.team, p_pin: auth.pin, p_id: id}); } catch(e) {}
}

// ---------- helpers ----------
function matchTime(m){ return m.time || slotTime(S(), m.slot); }
function fmtWhen(m){ return esc(matchTime(m)); }
function fmtDate(){ const d = S().date; if(!d) return ''; const x = new Date(d + 'T12:00:00'); return isNaN(x) ? d : x.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'}); }
function umpLine(m){ return m.ump ? `<span>·</span><span>Umpire: ${esc(tn(m.ump))}</span>` : ''; }
function groundName(i){ return S().grounds[i] || `Ground ${i+1}`; }
function teamInn(m, team){ return (m.innings||[]).find(i => i.bat === team); }
function scoreOf(m, team){
  const inn = teamInn(m, team); if(!inn || !inn.started) return '';
  const s = innStats(inn, S());
  return `${s.runs}/${s.w} <small>(${oversStr(s.legal, S())})</small>`;
}
function resultText(m){
  const r = matchResult(m, S()); if(!r) return '';
  if(r.type === 'nr') return 'No result';
  if(r.type === 'tie') return r.winner ? `Tied · ${esc(tn(r.winner))} won the super over` : 'Match tied';
  return `${esc(tn(r.winner))} won by ${r.margin}`;
}
function chip(b){
  const s = S();
  if(b.w){ const t = ballTotal(b, s); return `<span class="b w">${t ? t + 'W' : 'W'}</span>`; }
  if(b.x === 'wd') return `<span class="b x">${s.wideRuns + (b.e||0)}wd</span>`;
  if(b.x === 'nb') return `<span class="b x">nb${b.r ? '+'+b.r : ''}</span>`;
  if(b.x === 'b' || b.x === 'lb') return `<span class="b x">${b.e}${b.x}</span>`;
  if(b.r === 4) return `<span class="b f">4</span>`;
  if(b.r === 6) return `<span class="b s">6</span>`;
  return `<span class="b">${b.r ? b.r : '•'}</span>`;
}
function howOut(o){
  if(!o) return 'not out';
  const bw = pn(o.bw), f = o.f ? pn(o.f) : '';
  switch(o.k){
    case 'bowled': return `b ${bw}`;
    case 'caught': return o.f === o.bw ? `c &amp; b ${bw}` : `c ${f} b ${bw}`;
    case 'lbw': return `lbw b ${bw}`;
    case 'stumped': return `st ${f} b ${bw}`;
    case 'hitwicket': return `hit wicket b ${bw}`;
    case 'runout': return `run out${f ? ' ('+f+')' : ''}`;
    case 'outofbox': return S().boxToBowler !== false ? `out of box b ${bw}` : 'out of box';
  }
  return 'out';
}
function perfLine(p){
  const s = S(), bits = [];
  if(p.batted) bits.push(`${p.r}${p.out ? '' : '*'} (${p.b})`);
  if(p.balls) bits.push(`${p.wk}/${p.conc} (${oversStr(p.balls, s)})`);
  const f = []; if(p.ct) f.push(`${p.ct} ct`); if(p.ro) f.push(`${p.ro} ro`); if(p.stp) f.push(`${p.stp} st`);
  if(f.length) bits.push(f.join(', '));
  return bits.join(' · ') || 'Did not bat or bowl';
}
let toastTimer;
function toast(msg){
  let t = $('.toast'); if(!t){ t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600);
}

function matchCard(m){
  const r = matchResult(m, S()), live = m.status === 'live';
  const row = t => `<div class="mrow"><span class="tname ${r && r.winner && r.winner !== t ? 'lose' : ''}"><i class="dot" style="--c:${tc(t)}"></i>${esc(tn(t))}</span><span class="msc">${scoreOf(m, t)}</span></div>`;
  let foot = '';
  if(m.status === 'done') foot = `<div class="mres">${resultText(m)}${m.mom ? ` · MoM ${esc(pn(m.mom))}` : ''}</div>`;
  else if(live){
    const i = m.innings.length - 1, inn = m.innings[i];
    if(i === 1 && inn.started){ const s = innStats(inn, S()), need = target(m, S()) - s.runs, left = S().overs*S().bpo - s.legal; foot = `<div class="mres">${esc(tn(inn.bat))} need ${need} off ${left} ball${left===1?'':'s'}</div>`; }

  return `<button class="mcard ${live ? 'live' : ''}" data-act="open" data-id="${m.id}">

function renderMatches(){

  if(!ui.sheet){ root.innerHTML = ''; return; }

  const close = sh.auto ? `<button class="btn" data-act="undo">Undo last ball</button>` : `<button class="btn" data-act="close">Cancel</button>`;

  else if(sh.type === 'wicket'){ h = 'Wicket'; body = wicketSheet(m); foot = `<button class="btn" data-act="close">Cancel</button>`; }
  else if(sh.type === 'batter'){
    const inn = m.innings[m.innings.length-1], st = innStats(inn, S());
    const yet = (m.xi[inn.bat]||[]).filter(id => !st.order.includes(id));
    const vacantSt = !inn.cur.st;

function wicketSheet(m){

    const sh = ui.sheet, f = ['caught','runout','stumped'].includes(sh.k) ? (sh.f || null) : null, w = {k: sh.k, p: sh.p, f};
    if(sh.k === 'runout' && sh.x === 'wd') ball({x:'wd', e: sh.r, w});
    else if(sh.k === 'runout' && sh.x === 'nb') ball({x:'nb', r: sh.r, w});
    else if(sh.k === 'stumped' && sh.x === 'wd') ball({x:'wd', e: 0, w});
    else ball({r: sh.k === 'runout' ? sh.r : 0, w});
  },
  'wk-x'(el){ ui.sheet.x = el.dataset.k; renderSheet(); },
  'new-bat'(el){
    const m = curMatch(), inn = m.innings[m.innings.length-1], other = inn.cur.st || inn.cur.ns, strike = !!(ui.sheet && ui.sheet.strike);
    inn.cur = Object.assign({}, inn.cur, strike || !other ? {st: el.dataset.id, ns: other || null} : {st: other, ns: el.dataset.id});
    ui.sheet = null; touchMatch(m);
  },
  strike(el){ ui.sheet.strike = el.checked; },
  'all-bowlers'(el){ ui.showAllBowlers = el.checked; renderSheet(); },
  'set-bowler'(el){ const m = curMatch(), inn = m.innings[m.innings.length-1]; inn.cur = Object.assign({}, inn.cur, {bw: el.dataset.id}); ui.sheet = null; ui.showAllBowlers = false; touchMatch(m); },
  swap(){ const m = curMatch(), inn = m.innings[m.innings.length-1]; if(!inn.cur.ns || !inn.cur.st) return; inn.cur = Object.assign({}, inn.cur, {st: inn.cur.ns, ns: inn.cur.st}); touchMatch(m); toast(`${pn(inn.cur.st)} on strike`); },
  undo(){ const m = curMatch(); if(!m) return; ui.sheet = null; ui.draft = null; if(undoBall(m)) touchMatch(m); else render(); },
  so(el){ ui.draft.so = el.dataset.t || null; render(); },
  mom(el){ ui.draft.mom = el.dataset.id; render(); },
  finish(){
    const m = curMatch(), d = ui.draft, sel = $('#mom-any');
    m.mom = d.mom || (sel && sel.value) || null; m.soWinner = d.so || null; m.status = 'done';
    ui.score = null; ui.match = m.id; ui.draft = null; touchMatch(m); publishSoon(); toast('Match finished. Table and stats updated.');
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el || el.tagName === 'SELECT' || el.type === 'checkbox') return;
  const f = ACT[el.dataset.act]; if(f){ if(el.dataset.act !== 'scrim') e.preventDefault(); f(el, e); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset && el.dataset.act === 'mom-sel'){ ui.draft.mom = el.value; render(); }
  else if(el.type === 'checkbox' && el.dataset.act && ACT[el.dataset.act]) ACT[el.dataset.act](el, e);
});
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.id === 'login-pin'){ e.preventDefault(); ACT['login-go'](); return; } if(e.key === 'Enter' && e.target.id && e.target.id.startsWith('add-')){ e.preventDefault(); const b = e.target.closest('.row').querySelector('[data-act=add-player]'); if(b) ACT['add-player'](b); return; } if(e.key === 'Escape' && ui.sheet && !ui.sheet.auto){ ui.sheet = null; render(); } });

// ---------- boot ----------
render();
loadAll().then(subscribe);

</script>
</body>
</html>
